name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BASE_URL: http://127.0.0.1:3000
      ENV: local
      CI: true
      CI_WORKERS: 2

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9.15.0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20.19.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build packages
        run: |
          pnpm --filter @enterprise-playwright/shared-types build
          pnpm --filter @enterprise-playwright/core build

      - name: Install Playwright Chromium
        run: pnpm --filter @enterprise-playwright/automation-demo-app exec playwright install --with-deps chromium

      - name: Setup Java (Allure CLI)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - name: Start demo web
        working-directory: applications/automation-demo-app
        run: |
          pnpm web:dev &
          echo $! > /tmp/demo-web.pid

      - name: Wait for readiness
        run: |
          for i in $(seq 1 60); do
            if curl -sf "$BASE_URL" >/dev/null; then
              echo "Demo web is ready"
              exit 0
            fi
            sleep 2
          done
          echo "Demo web failed to become ready"
          exit 1

      - name: Type-check
        run: pnpm type-check

      - name: Unit tests
        run: pnpm test:unit

      - name: Validate tags
        run: pnpm validate:tags

      - name: Smoke E2E
        id: e2e
        working-directory: applications/automation-demo-app
        run: pnpm test:smoke
        continue-on-error: true

      - name: Generate Allure report
        if: always()
        working-directory: applications/automation-demo-app
        run: pnpm allure:generate
        continue-on-error: true

      - name: Upload Allure artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: allure-artifacts
          path: |
            applications/automation-demo-app/allure-results
            applications/automation-demo-app/allure-report
          if-no-files-found: ignore

      - name: Fail job if E2E failed
        if: steps.e2e.outcome != 'success'
        run: |
          echo "Smoke E2E failed"
          exit 1
